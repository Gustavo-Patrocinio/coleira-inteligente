[project]
name = "coleira-ml"
version = "0.1.0"
description = "Pipeline de ML da coleira: janelamento, features, modelos e quantização"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyarrow>=26.0.1",
]

# PyTorch e a conversão TFLite entram quando chegarmos na CNN (ver checklist da Fase 0).

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "nbconvert>=7.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coleira_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
