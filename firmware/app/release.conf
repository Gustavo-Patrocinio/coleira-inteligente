# Release overlay (rule: zero printk/logs in release builds).
#   west build -b xiao_ble/nrf52840/sense app -- -DEXTRA_CONF_FILE=release.conf
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_ASSERT=n
# The NCS and Zephyr boot banners select PRINTK, so they must go too
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
# No console at all: the USB serial port only exists for logs (charging is hardware)
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_USB_DEVICE_STACK=n
