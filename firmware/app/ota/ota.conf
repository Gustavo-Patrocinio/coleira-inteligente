# OTA variant, app side (ADR 0015): MCUmgr SMP over BLE (image upload, test, confirm, reset).
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
# The new image confirms itself after a health check (src/ota.c); otherwise MCUboot reverts.
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
# The update slot is in QSPI flash
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16
# Larger BLE buffers for faster uploads (values recommended by NCS's mcumgr_bt_ota_dfu)
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=498
