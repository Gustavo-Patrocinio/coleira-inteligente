# OTA variant (Phase 3, ADR 0015): MCUboot + BLE DFU. Replaces ../sysbuild.conf when passed as
#   west build ... firmware/app -- -DSB_CONF_FILE=ota/sysbuild.conf -DEXTRA_CONF_FILE=ota/ota.conf
#     -DEXTRA_DTC_OVERLAY_FILE=ota/ota.overlay -DPM_STATIC_YML_FILE=ota/pm_static.yml
# Needs an SWD probe once, to put MCUboot where Seeed's UF2 bootloader was.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
# The update slot lives in the XIAO's 2 MB QSPI flash, so the internal flash keeps the 416 KB
# summary partition (~13 days) and a 560 KB slot for the running firmware.
SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
# Signing key: MCUboot's public development key unless you pass your own (keep it out of git):
#   -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"C:/keys/collar-ec-p256.pem\"
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
