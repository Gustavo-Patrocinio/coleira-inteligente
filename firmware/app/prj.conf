# ---- Sensor (same as the logger; contract 4.2 / ADR 0005 / ADR 0010)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_ACCEL_FS=16
CONFIG_LSM6DSL_GYRO_FS=2000
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_GYRO_ODR=4
CONFIG_FPU=y

# ---- TensorFlow Lite Micro with Arm's optimized CMSIS-NN kernels
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y
CONFIG_COLLAR_TENSOR_ARENA_SIZE=16384

# ---- Per-minute summaries in flash (ADR 0013; partition layout in boards/*.overlay)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FCB=y

# ---- BLE peripheral with the summary sync service (contract 4.8)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Collar"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---- Inference timing (DWT cycle counter)
CONFIG_TIMING_FUNCTIONS=y

# ---- Threads
CONFIG_MAIN_STACK_SIZE=4096

# ---- Logging over the USB serial port (development only; disabled by release.conf)
CONFIG_LOG=y
