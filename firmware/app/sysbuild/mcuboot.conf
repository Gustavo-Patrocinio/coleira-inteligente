# MCUboot for the OTA variant (ADR 0015): reads the update slot from the QSPI flash.
# 560 KB slots / 4 KB sectors = 140 sectors
CONFIG_BOOT_MAX_IMG_SECTORS=256
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16
# QSPI needs the kernel clock and threads
CONFIG_CLOCK_CONTROL=y
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_NRF_RTC_TIMER=y
CONFIG_MULTITHREADING=y
# Fit in 48 KB: no USB console or logs in the bootloader (the board enables them by default)
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n
