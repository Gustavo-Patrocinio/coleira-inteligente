# West manifest: pins the nRF Connect SDK version for every firmware in this repo.
#
# The SDK (several GB) lives NEXT TO the repo, never inside it:
#
#   mkdir collar-ws && cd collar-ws
#   git clone https://github.com/Gustavo-Patrocinio/coleira-inteligente.git
#   west init -l coleira-inteligente --mf firmware/west.yml
#   west update
#
# Bump the revision deliberately (and note it in the commit), never float on main.
manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v2.9.0
      import: true
    # Optional Zephyr module, not imported by NCS by default; needed by firmware/app.
    # Same commit as NCS v2.9.0's zephyr/submanifests/optional.yaml.
    - name: tflite-micro
      url: https://github.com/zephyrproject-rtos/tflite-micro
      revision: 48613f7ba1ffbda46ad771a77a35408f48f922e9
      path: modules/lib/tflite-micro
  self:
    path: coleira-inteligente
