# ---- Sensor: LSM6DS3TR-C on the XIAO nRF52840 Sense (Zephyr "st,lsm6dsl" driver)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
# Full scale fixed at build time (contract 4.2 / ADR 0005): ±16 g, ±2000 dps
CONFIG_LSM6DSL_ACCEL_FS=16
CONFIG_LSM6DSL_GYRO_FS=2000
# ODR 104 Hz (ADR 0010): 4 = 104 Hz in the driver's ODR table
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_GYRO_ODR=4
CONFIG_FPU=y

# ---- Bluetooth LE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Collar-Logger"
CONFIG_BT_MAX_CONN=1
# Needed even as a peripheral: bt_gatt_exchange_mtu() lives in the GATT client
CONFIG_BT_GATT_CLIENT=y
# Bigger packets: MTU 247, data length 251, 2M PHY (ADR 0010)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10

# ---- Threads / misc
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_GPIO=y

# ---- Logging over the USB serial port (development only; disabled by release.conf)
CONFIG_LOG=y
