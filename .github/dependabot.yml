# Weekly update PRs, so known vulnerabilities do not sit unnoticed (npm audit runs in CI too).
# Minor and patch updates come grouped in one PR per ecosystem; majors come one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      app-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: docker-compose
    directory: /backend/deploy
    schedule: { interval: monthly }
