# Weekly update PRs, so known vulnerabilities do not sit unnoticed (npm audit runs in CI too).
# Minor and patch updates come grouped in one PR per ecosystem; majors come one by one.
# Ignored on purpose (update by hand, deliberately):
# - the TimescaleDB image: a Postgres major change needs a dump/restore of the data volume
# - Node and @types/node majors: the server stays on Node 22 LTS
# - TypeScript majors (7 is the native rewrite; not needed here)
# - vitest 5 (its peer dependencies crash npm 10's installer; revisit with npm 11)
# - cupertino_icons 2 (no icon the app uses changed; nothing to gain)
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        versions: ["5.x"]
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      app-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: cupertino_icons
        versions: ["2.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /backend/deploy
    schedule: { interval: monthly }
    ignore:
      - dependency-name: timescale/timescaledb
