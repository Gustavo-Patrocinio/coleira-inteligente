# Runs every test suite on each push and pull request. No hardware involved: the firmware is
# built (not flashed) and its C logic is tested on the host (ml/tests/test_firmware_host.py).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: ML (ruff + pytest, firmware C logic via zig)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  backend:
    name: Backend (typecheck + tests on TimescaleDB)
    runs-on: ubuntu-24.04
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: collar
          POSTGRES_PASSWORD: collar
          POSTGRES_DB: collar
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U collar" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # known vulnerabilities in what the server runs fail the build (dev tools: report only)
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical || true
      - run: npm run typecheck
      - run: npm test

  app:
    name: App (flutter analyze + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  labeler:
    name: Labeler (node --test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/labeler/test/*.test.js

  firmware:
    name: Firmware (NCS v2.9.0 build, 0 warnings)
    runs-on: ubuntu-24.04
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.9.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: coleira-inteligente
      - name: Cache the west workspace (SDK, Zephyr, modules)
        uses: actions/cache@v4
        with:
          path: |
            nrf
            zephyr
            modules
            bootloader
            nrfxlib
            test
            tools
          key: west-${{ hashFiles('coleira-inteligente/firmware/west.yml') }}
      - name: West init + update (pinned by firmware/west.yml)
        run: |
          [ -d .west ] || west init -l coleira-inteligente --mf firmware/west.yml
          west update --narrow -o=--depth=1
      - name: Signing key for OTA images (repository secret, if set)
        env:
          KEY: ${{ secrets.MCUBOOT_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "$KEY" >"$RUNNER_TEMP/collar-ec-p256.pem"
            echo "SIGN=-DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"$RUNNER_TEMP/collar-ec-p256.pem\"" >> "$GITHUB_ENV"
            echo "KEYTAG=" >> "$GITHUB_ENV"
          else
            echo "SIGN=" >> "$GITHUB_ENV"
            echo "KEYTAG=-devkey" >> "$GITHUB_ENV"
          fi
      - name: Build logger and app (UF2 debug/release, OTA debug/release)
        run: |
          set -o pipefail
          FW=coleira-inteligente/firmware
          # image version = the tag (v1.2.3 → 1.2.3+0); the app compares it with the collar's
          VER=0.0.0
          case "$GITHUB_REF" in refs/tags/v*) VER="${GITHUB_REF_NAME#v}" ;; esac
          OTA="-DSB_CONF_FILE=ota/sysbuild.conf -DEXTRA_DTC_OVERLAY_FILE=ota/ota.overlay -DPM_STATIC_YML_FILE=ota/pm_static.yml $SIGN -Dapp_CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION=\"$VER+0\""
          build() {  # name, source dir, extra cmake args
            west build -p always -b xiao_ble/nrf52840/sense -d build/$1 $FW/$2 -- $3 2>&1 | tee build-$1.log
            # compiler warnings only (board defconfigs print harmless Kconfig notes)
            if grep -nE "\.(c|cc|cpp|h):[0-9]+:[0-9]+: warning:" build-$1.log; then
              echo "::error::compiler warnings in $1"; exit 1
            fi
            grep -E "FLASH:|RAM:" build-$1.log
          }
          build logger logger ""
          build app app ""
          build app-release app "-DEXTRA_CONF_FILE=release.conf"
          build ota app "$OTA -DEXTRA_CONF_FILE=ota/ota.conf"
          build ota-release app "$OTA -DEXTRA_CONF_FILE=ota/ota.conf;release.conf"
      - name: Collect the files people flash
        run: |
          mkdir dist
          cp build/logger/logger/zephyr/zephyr.uf2 dist/collar-logger.uf2
          cp build/app-release/app/zephyr/zephyr.uf2 dist/collar.uf2
          cp build/app/app/zephyr/zephyr.uf2 dist/collar-debug-log.uf2
          cp build/ota-release/merged.hex dist/collar-ota-first-flash$KEYTAG.hex
          cp build/ota-release/dfu_application.zip dist/collar-ota-update$KEYTAG.zip
          cp build/ota-release/app/zephyr/zephyr.signed.bin dist/collar-ota-update$KEYTAG.bin
          cp build/ota/merged.hex dist/collar-ota-debug-log-first-flash$KEYTAG.hex
          cp build/ota/dfu_application.zip dist/collar-ota-debug-log-update$KEYTAG.zip
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ml, backend, app, labeler, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Create the release with the firmware files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file docs/flashing.md --prerelease
