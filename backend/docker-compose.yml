# Local Postgres 16 + TimescaleDB for development and tests.
#   docker compose up -d
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: collar
      POSTGRES_PASSWORD: collar
      POSTGRES_DB: collar
    ports:
      - "54329:5432"
    volumes:
      - collar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collar"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  collar-db:
