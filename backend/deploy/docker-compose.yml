# Self-hosted Collar backend with automatic HTTPS (see ../DEPLOY.md).
#   cp .env.example .env    # set DOMAIN, POSTGRES_PASSWORD, JWT_SECRET
#   docker compose up -d --build
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: collar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: collar
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collar"]
      interval: 5s
      timeout: 3s
      retries: 30
    # no ports: the database is only reachable from the other containers

  api:
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://collar:${POSTGRES_PASSWORD}@db:5432/collar
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 3000
      ALERTS_EVERY_MIN: ${ALERTS_EVERY_MIN:-60}
      TRUST_PROXY: "true" # behind Caddy: rate limits per real client IP
      # push notifications: put the Firebase service account in ./secrets/fcm.json and set
      # FCM_SERVICE_ACCOUNT_FILE=/secrets/fcm.json in .env (DEPLOY.md, Push notifications)
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      # password reset codes by email (DEPLOY.md, Email); empty = reset by email off
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  backup:
    # Nightly pg_dump into ./backups; dumps older than 14 days are pruned.
    # The offsite service below copies them off the server.
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/collar-$$(date +%F).dump
          pg_dump -h db -U collar -Fc collar > $$f.tmp && mv $$f.tmp $$f && echo "backup $$f"
          find /backups -name 'collar-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  offsite:
    # Optional (DEPLOY.md, step 5): encrypted copy of ./backups in object storage, so a dead
    # server does not take the backups with it. Start with: docker compose --profile offsite up -d
    profiles: ["offsite"]
    image: rclone/rclone:1.76.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/offsite.sh"]
    environment:
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-14}
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: Other
      RCLONE_CONFIG_STORE_ENDPOINT: ${S3_ENDPOINT:-}
      RCLONE_CONFIG_STORE_REGION: ${S3_REGION:-}
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_STORE_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_STORE_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_SAFE_TYPE: crypt
      RCLONE_CONFIG_SAFE_FILENAME_ENCRYPTION: "off"
      RCLONE_CONFIG_SAFE_DIRECTORY_NAME_ENCRYPTION: "false"
    volumes:
      - ./backups:/backups
      - ./offsite.sh:/offsite.sh:ro

volumes:
  db-data:
  caddy-data:
  caddy-config:
